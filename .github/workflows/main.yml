name: Android CI

permissions:
  contents: read
  checks: write

on:
  push:
    branches:
      - master
      - dev**
  pull_request:
    branches:
      - master
      - dev**

jobs:
  build_and_upload_artifacts:
    name: Generate APKs
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/workflows/config

      # Same cache as in the test jobs, for the tree with all four ABIs this job builds.
      - name: Restore native build outputs
        uses: actions/cache@v6
        with:
          path: |
            nativeLibs/mupdfModule/.cxx
            nativeLibs/mupdfModule/build/intermediates/cxx
            nativeLibs/djvuModule/.cxx
            nativeLibs/djvuModule/build/intermediates/cxx
          key: ${{ runner.os }}-native-build-all-${{ hashFiles('thirdparty_build.gradle', 'nativeLibs/patches/**', 'nativeLibs/common/**', 'nativeLibs/mupdfModule/jni/**', 'nativeLibs/mupdfModule/build.gradle', 'nativeLibs/djvuModule/jni/**', 'nativeLibs/djvuModule/cmake/**', 'nativeLibs/djvuModule/build.gradle', 'build.gradle', 'project.gradle') }}
          restore-keys: |
            ${{ runner.os }}-native-build-all-

      - name: Build debug APK
        run: bash ./gradlew assembleDebug --stacktrace -Porion.CIBuild=true

      - name: Read value from Properties-file
        id: read_version_property
        uses: christian-draeger/read-properties@1.0.1
        with:
          path: './orion-viewer/version.properties'
          property: 'orion.version.name'

      - name: Upload arm7 APK
        uses: actions/upload-artifact@v7
        with:
          name: orion-viewer-${{steps.read_version_property.outputs.value}}-${{github.run_number}}-armeabi-v7a-debug.apk
          path: orion-viewer/build/outputs/apk/debug/orion-viewer-*-v7a-debug.apk
      - name: Upload arm64 APK
        uses: actions/upload-artifact@v7
        with:
          name: orion-viewer-${{steps.read_version_property.outputs.value}}-${{github.run_number}}-arm64-v8a-debug.apk
          path: orion-viewer/build/outputs/apk/debug/orion-viewer-*-v8a-debug.apk
      - name: Upload x86 APK
        uses: actions/upload-artifact@v7
        with:
          name: orion-viewer-${{steps.read_version_property.outputs.value}}-${{github.run_number}}-x86-debug.apk
          path: orion-viewer/build/outputs/apk/debug/orion-viewer-*-x86-debug.apk
      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v7
        with:
          name: orion-viewer-${{steps.read_version_property.outputs.value}}-${{github.run_number}}-x86_64-debug.apk
          path: orion-viewer/build/outputs/apk/debug/orion-viewer-*-x86_64-debug.apk

  test:
    strategy:
      fail-fast: false
      matrix:
        arch: [[15, x86, ubuntu-22.04], [16, x86, ubuntu-24.04], [19, x86, ubuntu-24.04], [21, x86, ubuntu-24.04], [23, x86, ubuntu-24.04], [28, x86, ubuntu-24.04], [30, x86_64, ubuntu-24.04],  [33, x86_64, ubuntu-24.04], [35, x86_64, ubuntu-24.04], [36, x86_64, ubuntu-24.04]]
    env:
      ANDROID_EMULATOR_WAIT_TIME_BEFORE_KILL: 170
      EMULATOR_API: ${{ matrix.arch[0] }}
    runs-on: ${{ matrix.arch[2] }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Run job configurations
        uses: ./.github/workflows/config

      - name: install libncurses5
        run: sudo apt-get update && sudo apt-get install -y libncurses5
        if:  ${{ matrix.arch[0] == 15 }}

      # cmake/ninja outputs of mupdf and djvu for this job's ABI (about 110 MB compressed):
      # with injected.build.abi a job builds one ABI, so a restored tree makes buildCMakeDebug[abi]
      # a no-op apart from the few JNI files the checkout touched. Keyed by everything that goes
      # into the native build; the Android 4.0 build (API 15) has its own configuration.
      - name: Restore native build outputs
        uses: actions/cache@v6
        with:
          path: |
            nativeLibs/mupdfModule/.cxx
            nativeLibs/mupdfModule/build/intermediates/cxx
            nativeLibs/djvuModule/.cxx
            nativeLibs/djvuModule/build/intermediates/cxx
          key: ${{ runner.os }}-native-build-${{ matrix.arch[1] }}-android40_${{ matrix.arch[0] == 15 }}-${{ hashFiles('thirdparty_build.gradle', 'nativeLibs/patches/**', 'nativeLibs/common/**', 'nativeLibs/mupdfModule/jni/**', 'nativeLibs/mupdfModule/build.gradle', 'nativeLibs/djvuModule/jni/**', 'nativeLibs/djvuModule/cmake/**', 'nativeLibs/djvuModule/build.gradle', 'build.gradle', 'project.gradle') }}
          restore-keys: |
            ${{ runner.os }}-native-build-${{ matrix.arch[1] }}-android40_${{ matrix.arch[0] == 15 }}-

      - name: run tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.arch[0] }}
          arch: ${{ matrix.arch[1] }}
          # API 30 runs on the Automated Test Device image: no SystemUI, launcher or Google apps,
          # so less to crash (the default Android 11 image lost surfaceflinger mid-run). ATD images
          # are published for API 30 only.
          target: ${{ matrix.arch[0] == 30 && 'aosp_atd' || 'default' }}
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          sdcard-path-or-size: 500M
          # the manual screen tour (src/androidTestTour) is compiled only for the tour build type, see screenshots.yml
          # injected.build.abi: build and install the native libraries for the emulator's ABI only, not all four
          script: ./gradlew forwardLogcat connectedDebugAndroidTest -Porion.CIBuild=true -Pandroid.injected.build.abi=${{ matrix.arch[1] }} -Porion.build.android40=${{ matrix.arch[0] == 15 }}

      - name: Name test suite
        # AGP names the single <testsuite> after the first test class that ran
        run: sed -i 's/<testsuite name="[^"]*"/<testsuite name="Instrumentation tests, API ${{ matrix.arch[0] }}"/' orion-viewer/build/outputs/androidTest-results/connected/debug/TEST-*.xml || true
        if: failure()

      - uses: dorny/test-reporter@v3
        with:
          name: Test results ${{ matrix.arch[0] }}
          path: orion-viewer/build/outputs/androidTest-results/connected/debug/TEST-*.xml
          reporter: java-junit
          use-actions-summary: false
          fail-on-error: true
          fail-on-empty: true
          list-tests: failed
        if: failure()

      - name: Upload screenshots and logcat
        uses: actions/upload-artifact@v7
        with:
          name: screenshotsAndLogcat${{ matrix.arch[0] }}
          path: orion-viewer/build/failures/
          if-no-files-found: ignore
        if: failure()

      - name: Test Summary
        uses: test-summary/action@v2
        with:
          paths: orion-viewer/build/outputs/androidTest-results/connected/debug/TEST-*.xml
        if: always()