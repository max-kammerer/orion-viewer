plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.multiplatform'
}

android {
    compileSdk = orionCompileSdk
    defaultConfig {
        minSdkVersion 14
    }

    namespace 'universe.constellation.orion.common'

    buildFeatures {
        buildConfig true
    }
}

kotlin {
    jvmToolchain(17)

    androidTarget()
    // Plain JVM target: lets the document model and layout logic run under `./gradlew :common:jvmTest`
    // without an emulator. Its actuals live in jvmMain.
    jvm()

    sourceSets {

        androidMain {
            dependencies {
                implementation 'androidx.collection:collection:1.2.0'
            }
        }

        jvmTest {
            dependencies {
                implementation 'org.jetbrains.kotlin:kotlin-test'
            }
        }
    }

}